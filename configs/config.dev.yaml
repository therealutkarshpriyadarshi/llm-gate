server:
  port: 8080
  host: "0.0.0.0"
  read_timeout: 30s
  write_timeout: 30s
  shutdown_timeout: 10s
  max_header_bytes: 1048576

log:
  level: "debug"
  format: "console"

cache:
  enabled: true
  host: "redis"
  port: 6379
  password: ""
  db: 0

database:
  host: "postgres"
  port: 5432
  user: "llmgate"
  password: "llmgate_dev"
  database: "llmgate_dev"
  ssl_mode: "disable"

metrics:
  enabled: true
  port: 9090
  path: "/metrics"

providers:
  enabled:
    - openai
  openai:
    enabled: true
    api_key: "${OPENAI_API_KEY}"
    base_url: "https://api.openai.com/v1"
    organization: ""

routing:
  strategy: "round-robin"
  enable_health_checks: true
  health_check_interval: 30  # seconds
  enable_fallback: true
