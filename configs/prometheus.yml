global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'llmgate'
    replica: '0'

scrape_configs:
  - job_name: 'llmgate'
    static_configs:
      - targets: ['host.docker.internal:8080']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
