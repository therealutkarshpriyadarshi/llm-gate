server:
  port: 8080
  host: "0.0.0.0"
  read_timeout: 30s
  write_timeout: 30s
  shutdown_timeout: 30s
  max_header_bytes: 1048576  # 1 MB

log:
  level: "info"
  format: "json"

cache:
  enabled: false
  host: "localhost"
  port: 6379
  password: ""
  db: 0

database:
  host: "localhost"
  port: 5432
  user: "llmgate"
  password: "llmgate"
  database: "llmgate"
  ssl_mode: "disable"

metrics:
  enabled: true
  port: 9090
  path: "/metrics"

providers:
  enabled:
    - openai
  openai:
    enabled: true
    api_key: "${OPENAI_API_KEY}"
    base_url: "https://api.openai.com/v1"
    organization: ""

routing:
  strategy: "round-robin"
  enable_health_checks: true
  health_check_interval: 30  # seconds
  enable_fallback: true

# Phase 7: Cost Optimization & Rate Limiting
cost:
  enabled: true
  buffer_size: 100
  flush_interval_secs: 10

rate_limit:
  enabled: true
  default_tier: "free"  # free, pro, enterprise

optimization:
  enable_compression: true
  enable_truncation: true
  max_prompt_tokens: 4000
  max_response_tokens: 2000
  enable_smart_truncation: true
